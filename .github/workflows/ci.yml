name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify PWA artifacts
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/pwa-192x192.png
          test -f dist/pwa-512x512.png
          test -f dist/maskable-icon-512x512.png
          grep -q 'pdf.worker' dist/sw.js
